{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — Unke Liye</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'public-assets/css/variables.css' %}" />
  <link rel="stylesheet" href="{% static 'public-assets/css/base.css' %}" />
  <link rel="stylesheet" href="{% static 'public-assets/css/components.css' %}" />
  <link rel="stylesheet" href="{% static 'public-assets/css/animations.css' %}" />
  <style>
    .not-found-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--color-primary-dark), var(--color-primary));
    }
    .not-found-card {
      background: var(--color-surface);
      border-radius: var(--radius-xl);
      padding: var(--space-16) var(--space-12);
      max-width: 560px;
      margin: var(--space-6);
      text-align: center;
      box-shadow: var(--shadow-xl);
    }
    .not-found-emoji { font-size: 5rem; display: block; margin-bottom: var(--space-6); animation: bounceSlight 2s ease-in-out infinite; }
    .not-found-code { font-family: var(--font-display); font-size: 5rem; font-weight: 700; color: var(--color-primary); line-height: 1; margin-bottom: var(--space-4); }
    .not-found-links { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--space-3); margin-top: var(--space-8); }
  </style>
</head>
<body>
<main id="main-content" style="display:contents">
  <div class="not-found-page">
    <div class="not-found-card animate-scale-in">
        <a href="{% url 'public:home' %}" class="nav-logo" style="display:inline-block;margin-bottom:1rem;"><img src="{% static 'public-assets/images/logo.png' %}" alt="Unke Liye" class="nav-logo-img" style="height:48px;width:auto;"></a>
      <span class="not-found-emoji" aria-hidden="true">🐾</span>
      <div class="not-found-code" aria-label="Error 404">404</div>
      <h1 style="font-size:var(--text-2xl);margin-bottom:var(--space-4)">This page wandered off.</h1>
      <p style="color:var(--color-text-muted);max-width:38ch;margin:0 auto">Like a lost puppy — the page you're looking for isn't here, but we'll help you find your way home.</p>
      <div class="not-found-links">
        <a href="{% url 'public:home' %}" class="btn btn--primary btn--lg">Go Home</a>
        <a href="{% url 'public:report_animal' %}" class="btn btn--urgent">Report an Animal</a>
        <a href="{% url 'public:sitemap' %}" class="btn btn--ghost">View All Pages</a>
      </div>
      <div style="margin-top:var(--space-10);padding-top:var(--space-8);border-top:1px solid var(--color-border)">
        <p style="font-size:var(--text-sm);color:var(--color-text-muted);margin-bottom:var(--space-4)">Or jump to a section:</p>
        <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:var(--space-2)">
          <a href="{% url 'public:adopt' %}" class="btn btn--ghost btn--sm">Adopt a Pet</a>
          <a href="{% url 'public:campaigns' %}" class="btn btn--ghost btn--sm">Campaigns</a>
          <a href="{% url 'public:volunteer' %}" class="btn btn--ghost btn--sm">Volunteer</a>
          <a href="{% url 'public:donate' %}" class="btn btn--ghost btn--sm">Donate</a>
          <a href="{% url 'public:contact' %}" class="btn btn--ghost btn--sm">Contact</a>
        </div>
      </div>
    </div>
  </div>
</main>
<script src="{% static 'public-assets/js/main.js' %}"></script>
</body>
</html>
