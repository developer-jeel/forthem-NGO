<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News & Press Editor · Content Manager · Unke Liye</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/admin.css">
  <style>
    .editor-layout { display:grid;grid-template-columns:1fr 320px;gap:24px; }
    .editor-main { background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:12px;overflow:hidden; }
    .editor-header { padding:24px;border-bottom:1px solid var(--border-subtle); }
    .editor-body { padding:0; }
    .input-title { font-size:24px;font-weight:700;font-family:var(--font-heading);width:100%;border:none;background:transparent;outline:none;padding:0;color:var(--text-primary);margin-bottom:12px; }
    .input-title::placeholder { color:var(--text-secondary);opacity:0.5; }
    
    .rich-text-toolbar { display:flex;gap:8px;padding:12px 24px;border-bottom:1px solid var(--border-subtle);background:var(--bg-sunken);align-items:center;flex-wrap:wrap; }
    .rt-btn { width:32px;height:32px;border:none;background:transparent;border-radius:6px;color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center; }
    .rt-btn:hover { background:rgba(0,0,0,0.05);color:var(--text-primary); }
    .rt-divider { width:1px;height:24px;background:var(--border-subtle);margin:0 4px; }
    
    .rich-text-area { padding:24px;min-height:400px;outline:none;font-size:15px;line-height:1.7; }
    .rich-text-area[empty]:before { content:attr(placeholder);color:var(--text-secondary);opacity:0.5;pointer-events:none;display:block; }
    
    .sidebar-panel { background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:12px;padding:24px;margin-bottom:24px; }
    .panel-title { font-size:14px;font-weight:600;margin-bottom:16px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-secondary); }
    
    .hero-upload { border:2px dashed var(--border-subtle);border-radius:8px;height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s;color:var(--text-secondary);background:var(--bg-canvas); }
    .hero-upload:hover { border-color:var(--brand-primary);color:var(--brand-primary);background:rgba(var(--brand-primary-rgb),0.02); }
    
    .form-group { margin-bottom:16px; }
    .form-label { display:block;font-size:14px;font-weight:500;margin-bottom:8px; }
    .form-control { width:100%;padding:10px 12px;border:1px solid var(--border-subtle);border-radius:6px;font-family:inherit;font-size:14px;background:var(--bg-canvas);color:var(--text-primary); }
    .form-control:focus { outline:none;border-color:var(--brand-primary); }
    
    @media(max-width:1024px){.editor-layout{grid-template-columns:1fr;}}
  </style>
</head>
<body>
  <div class="admin-shell">
    <aside id="sidebar" class="sidebar" role="navigation">
      <div class="sidebar-header">
        <img src="../user/logo.png" alt="Unke Liye NGO" style="width:36px;height:36px;object-fit:contain;border-radius:8px;background:rgba(255,255,255,0.15);padding:2px;flex-shrink:0;">
        <div class="logo-text"><strong>Unke Liye</strong><small>Content Manager</small></div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-group"><div class="nav-group-title">Content</div><a href="homepage-content.html" class="nav-link"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg><span class="label">Homepage Content</span></a><a href="banners.html" class="nav-link"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg><span class="label">Page Banners</span></a><a href="stories.html" class="nav-link"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg><span class="label">Stories</span></a><a href="news.html" class="nav-link active"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"/></svg><span class="label">News &amp; Press</span></a><a href="gallery.html" class="nav-link"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg><span class="label">Gallery</span></a><a href="media-library.html" class="nav-link"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg><span class="label">Media Library</span></a></div>
      </nav>
    </aside>
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left"><button id="sidebar-toggle" class="icon-btn" aria-label="Toggle sidebar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg></button><nav class="breadcrumb"><a href="news.html">News & Press</a><span class="separator">/</span><span class="current">New Article</span></nav></div>
        <div class="topbar-right">
          <button class="btn btn-outline">Schedule</button>
          <button class="btn btn-primary" onclick="alert('Published!')">Publish</button>
        </div>
      </header>
      <div class="page-content" style="padding:24px;">
        <div class="editor-layout">
          <div class="editor-main">
            <div class="editor-header">
              <input type="text" class="input-title" placeholder="News Headline...">
            </div>
            <div class="editor-body">
              <div class="rich-text-toolbar">
                <button class="rt-btn" title="Bold"><b>B</b></button>
                <button class="rt-btn" title="Italic"><i>I</i></button>
                <button class="rt-btn" title="Underline"><u>U</u></button>
                <div class="rt-divider"></div>
                <button class="rt-btn" title="Heading 2">H2</button>
                <button class="rt-btn" title="Heading 3">H3</button>
                <div class="rt-divider"></div>
                <button class="rt-btn" title="Quote"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>
                <button class="rt-btn" title="Link"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></button>
              </div>
              <div class="rich-text-area" contenteditable="true" placeholder="Write article content..."></div>
            </div>
          </div>
          
          <div class="editor-sidebar">
            <div class="sidebar-panel">
              <div class="panel-title">Settings</div>
              <div class="form-group">
                <label class="form-label">Category</label>
                <select class="form-control">
                  <option>Press Release</option>
                  <option>Announcement</option>
                  <option>Blog Post</option>
                  <option>Media Coverage</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Publish Date</label>
                <input type="date" class="form-control">
              </div>
            </div>
            
            <div class="sidebar-panel">
              <div class="panel-title">Featured Image</div>
              <div class="hero-upload" id="news-hero-box">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-bottom:8px;"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                <span style="font-weight:500;font-size:14px;">Upload Image</span>
              </div>
              <div style="margin-top:10px;">
                <a href="media-library.html?returnUrl=news-editor.html" class="btn btn-secondary btn-sm" style="width:100%; display:flex; align-items:center; justify-content:center; gap:0.35rem; text-decoration:none;">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                  Browse Media Library
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const inserted = params.get('insertedUrl');
      if (inserted) {
        const box = document.getElementById('news-hero-box');
        if (box) {
          box.innerHTML = `<img src="${inserted}" alt="Featured" style="width:100%;height:100%;object-fit:cover;border-radius:6px;">`;
          box.style.padding = '0';
        }
      }
    })();
  </script>
</body>
</html>
